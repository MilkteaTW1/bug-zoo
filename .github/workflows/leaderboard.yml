name: Update leaderboard and ladder

on:
  push:
    branches: [main]
    paths:
      - 'leaderboard/scores/**'
      - 'leaderboard/challenges/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Build leaderboard
        run: node bin/bugzoo.js leaderboard leaderboard/scores --out LEADERBOARD.md
      - name: Apply challenges and update ladder
        run: node bin/bugzoo.js ladder process leaderboard --out LADDER.md
      - name: Commit if changed
        run: |
          git add -A LEADERBOARD.md LADDER.md leaderboard/ladder.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update leaderboard and ladder"
            git push
          fi
